[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "commerceiq-api"
version = "0.1.0"
description = "Read-only analytics API for the CommerceIQ portfolio project"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.128.0",
  "psycopg[binary,pool]==3.3.2",
  "pydantic-settings==2.12.0",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psycopg_pool.*"]
ignore_missing_imports = true
